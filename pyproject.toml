[build-system]
requires = [
  "setuptools>=61.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "django-connectors"
version = "0.0.1"
description = "A Django framework for connecting applications to third-party systems, with support for authentication, polling, webhooks, incremental sync, and data ingestion via dlt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0",
]

[project.optional-dependencies]
dlt = ["dlt>=1.0"]

[project.urls]
Homepage = "https://github.com/gaussian/django-connectors"
Issues = "https://github.com/gaussian/django-connectors/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.9",
  "ruff>=0.10",
]

[tool.setuptools.packages.find]
include = ["django_connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root must be importable for `tests.settings` to resolve — there is no
# manage.py for pytest-django to locate the project from.
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff.lint]
# Pin to the classic real-errors rule set (pyflakes + core pycodestyle) rather
# than ruff 0.16+'s newer, broader default which pulls in style/modernization
# rules (UP/SIM/I/…). Two rules excluded:
#   F401 (imported-but-unused): fires on side-effect imports and re-exports that
#         are load-bearing despite looking unused. F821 (undefined name) still
#         catches genuinely-missing imports, so correctness is unaffected.
#   F841 (unused local): the codebase has intentional demo assignments.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]
