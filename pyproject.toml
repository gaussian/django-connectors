[build-system]
requires = [
  "setuptools>=61.0",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "django-connectors"
version = "0.0.1"
description = "A Django framework for connecting applications to third-party systems, with support for authentication, polling, webhooks, incremental sync, and data ingestion via dlt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0",
  "dlt>=1.0",
]

[project.urls]
Homepage = "https://github.com/gaussian/django-connectors"
Issues = "https://github.com/gaussian/django-connectors/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.9",
  "ruff>=0.10",
]

[tool.setuptools.packages.find]
include = ["django_connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root must be importable for `tests.settings` to resolve — there is no
# manage.py for pytest-django to locate the project from.
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# This repo started empty, so there is no legacy code to grandfather in — the
# rule set is deliberately broader than a "real errors only" pin. Keep it that
# way: it is far cheaper to hold the line from commit one than to adopt these
# rules later across a grown codebase.
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort — import ordering
  "UP",       # pyupgrade — modern syntax for the target-version
  "B",        # flake8-bugbear — likely bugs and footguns
  "C4",       # flake8-comprehensions
  "SIM",      # flake8-simplify
  "DJ",       # flake8-django — Django-specific correctness
  "RUF",      # ruff-specific rules
]
ignore = [
  # Line length is the formatter's job; `ruff format` wraps what it can and
  # E501 would then only fire on things it cannot split (long URLs, strings).
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports in package __init__ files are load-bearing despite looking unused.
# F821 (undefined name) still catches genuinely-missing imports.
"__init__.py" = ["F401"]
# Test settings modules are flat namespaces of constants by design.
"tests/settings.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["django_connectors"]
